name: Verify Summit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, evaluate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository files and private-file exclusions
        run: npm run check:repo
      - name: Run server, expedition, and fraction tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Evaluate deterministic content
        run: npm run eval
      - name: Build browser app
        run: npm run build
